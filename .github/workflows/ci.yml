name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dumbdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-verify:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '26.13.1']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Select managed Linux execution profile
        run: |
          mkdir -p .sites-runtime
          printf '%s\n' '{"executionProfile":"managed-linux"}' > .sites-runtime/execution-profile.json
      - run: npm run install:ci
      - run: npm test
      - name: Test guarded release tagging
        run: node --test scripts/tag-release.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:ci
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run test:e2e
      - run: npm run test:webmcp
      - run: npm run package:source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == '24.0.0'
        with:
          name: dumbdown-release
          path: release-artifacts/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-checks-node-${{ matrix.node }}
          path: test-results/
  node24-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.0.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the Node 24 declaration floor
        shell: bash
        run: bash scripts/check-node24-types.sh
  windows-verify:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '26.13.1']
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install chromium chrome
      - run: npm run test:e2e
      - run: npm run test:webmcp
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-checks-windows-node-${{ matrix.node }}
          path: test-results/
  source-consumer:
    needs: runtime-verify
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '26.13.1']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Download source artifact (first attempt)
        id: source1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.source1.outcome == 'failure'
        run: sleep 10
      - name: Download source artifact (second attempt)
        id: source2
        if: steps.source1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.source2.outcome == 'failure'
        run: sleep 20
      - name: Download source artifact (final attempt)
        if: steps.source2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Verify, install and exercise the packaged source
        shell: bash
        run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          version=$(node -p 'require("./package.json").version')
          unzip -q "release-artifacts/dumbdown_${version}_source.zip" -d "$RUNNER_TEMP/dumbdown-source-consumer"
          cd "$RUNNER_TEMP/dumbdown-source-consumer/dumbdown-${version}"
          npm run install:ci
          npm test
          npm run build
          npx playwright install --with-deps chromium chrome
          npm run test:e2e
          npm run test:webmcp
  verify:
    needs: [runtime-verify, node24-types, windows-verify, source-consumer]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Both runtime and platform checks passed.'
  artifact-transfer:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download release artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Verify transferred package checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Exercise release and tag guards without writes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { verifyActionCompatibility } = await import(process.env.GITHUB_WORKSPACE + '/scripts/test-ci-action-compat.mjs');
            await verifyActionCompatibility();
  artifact-missing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-nonexistent-transfer-guard
      - name: Reject an unexpected missing-artifact result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    needs: [verify, artifact-transfer, artifact-missing-guard]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download release artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download release artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download release artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dumbdown-release
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
