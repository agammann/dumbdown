name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Select managed Linux execution profile
        run: |
          mkdir -p .sites-runtime
          printf '%s\n' '{"executionProfile":"managed-linux"}' > .sites-runtime/execution-profile.json
      - run: npm run install:ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:ci
